version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_kapsayici
    ports:
      - "27017:27017"
    networks:
      - benimagim

  redis:
    image: redis:latest
    container_name: redis_kapsayici
    ports:
      - "6379:6379"
    networks:
      - benimagim

  shopin_api:
    image: shopin-api-final:latest
    container_name: shopinapi_kapsayici
    ports:
      - "8000:8000"
    networks:
      - benimagim
    depends_on:
      - mongo
      - redis
    restart: always

networks:
  benimagim:
    driver: bridge
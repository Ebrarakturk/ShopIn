version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_kapsayici
    ports:
      - "27017:27017"
    networks:
      - benimagim

  shopin_api:
    image: shopin-api-final:latest
    container_name: shopinapi_kapsayici
    ports:
      - "8000:8000"
    networks:
      - benimagim
    depends_on:
      - mongo
    restart: always

networks:
  benimagim:
    driver: bridge
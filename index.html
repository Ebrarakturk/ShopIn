<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ShopIn | Modern E-Ticaret</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; margin: 0; text-align: center; }
        .screen { display: none; padding: 50px 20px; }
        .active-screen { display: block; }
        .btn { padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; background: #2b2b2b; color: white; font-size: 16px; }
        .btn:hover { background: #ff4757; }
        input { padding: 10px; margin: 5px; width: 200px; border-radius: 5px; border: 1px solid #ccc; }
        /* Navbar Stili */
        .navbar { background: white; padding: 15px; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-right button { margin-left: 10px; }
    </style>
</head>
<body>

    <div id="screen-role" class="screen active-screen">
        <h2>ShopIn'e Hoş Geldiniz</h2>
        <p>Lütfen giriş türünüzü seçin:</p>
        <button class="btn" onclick="showAuth('user')">Kullanıcı Girişi</button>
        <button class="btn" onclick="showAuth('admin')">Yönetici Girişi</button>
    </div>

    <div id="screen-auth" class="screen">
        <h2 id="auth-title">Giriş Yap / Kayıt Ol</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı"><br>
        <input type="password" id="password" placeholder="Şifre"><br>
        <button class="btn" onclick="login()">Giriş Yap</button>
        <button class="btn" onclick="register()">Kayıt Ol</button>
        <br><br>
        <button class="btn" style="background:gray;" onclick="showScreen('screen-role')">Geri Dön</button>
    </div>

    <div id="screen-store" class="screen">
        <div class="navbar">
            <h2 style="margin:0;">ShopIn</h2>
            <div class="nav-right">
                <input type="text" placeholder="Ürün Ara...">
                <button class="btn">Ara</button>
                <select class="btn" style="background:white; color:black;"><option>Tüm Kategoriler</option></select>
                <button class="btn">🛒 Sepet (0)</button>
                <button class="btn" onclick="showScreen('screen-account')" style="background:#ff4757;">👤 Hesabım</button>
            </div>
        </div>
        <br>
        <h3>Ürünler Yükleniyor...</h3>
    </div>

    <div id="screen-account" class="screen">
        <h2>Hesap Detayları</h2>
        <button class="btn">📦 Geçmiş Siparişlerim</button>
        <button class="btn" onclick="showScreen('screen-store')">Alışverişe Dön</button>
        <button class="btn" onclick="logout()" style="background:red;">Çıkış Yap</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

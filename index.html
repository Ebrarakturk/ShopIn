<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ShopIn | Teknik Gereksinim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .navbar { background-color: #232f3e; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; color: #ff9900; }
        
        /* Gereksinim 2: Ürün Filtreleme Bölümü */
        .filter-bar { background: #fff; padding: 15px 5%; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        .filter-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 250px; }
        .filter-btn { background: #ff9900; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Ana İçerik */
        .container { padding: 20px 5%; }
        .section-title { color: #333; border-bottom: 2px solid #ff9900; padding-bottom: 10px; margin-bottom: 20px; }

        /* Ürün Kartları */
        #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .stock-tag { font-size: 12px; color: #27ae60; font-weight: bold; margin-bottom: 15px; } /* Gereksinim 1: Stok Görüntüleme */

        /* Butonlar (Tıklanabilir ve Teknik İsimli) */
        .btn { border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 12px; }
        .add-cart-btn { background: #f0c14b; border: 1px solid #a88734; } /* Gereksinim 3 */
        .delete-btn { background: #ffeded; color: #c40000; border: 1px solid #ffb2b2; } /* Gereksinim 7 */
        
        /* Yönetici Paneli Gereksinimleri (Alt Kısım) */
        .admin-panel { background: #fff; border: 2px solid #232f3e; border-radius: 8px; padding: 20px; margin-top: 40px; }
        .admin-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .admin-btn { background: #232f3e; color: white; } /* Gereksinim 6 & 8 */

        /* Siparişler Bölümü */
        #order-list { margin-top: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">ShopIn</div>
        <div onclick="listOrders()" style="cursor:pointer;">📦 Sipariş Geçmişini Listele (GET /orders)</div> </div>

    <div class="filter-bar">
        <input type="text" id="filter-input" class="filter-input" placeholder="Kategori veya isim yazın...">
        <button class="filter-btn" onclick="filterProducts()">Filtrele (GET /products?filter=...)</button>
    </div>

    <div class="container">
        <h2 class="section-title">Canlı Ürün Listesi</h2>
        <div id="product-grid">
            <p>Ürünler yükleniyor...</p>
        </div>

        <div class="admin-panel">
            <h3 style="margin-top:0;">Yönetici ve İşlem Araçları</h3>
            <div class="admin-grid">
                <button class="btn admin-btn" onclick="addProduct()">+ Yeni Ürün Ekle (POST /products)</button> <button class="btn admin-btn" onclick="createOrder()">🛒 Sipariş Oluştur (POST /orders)</button> <button class="btn admin-btn" onclick="updateOrderStatus()">🔄 Sipariş Durumu Güncelle (PUT /orders/id)</button> </div>
        </div>

        <div id="order-container" style="display:none;">
            <h3 class="section-title">Sipariş Kayıtları</h3>
            <div id="order-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

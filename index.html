<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopIn | Modern Alışveriş Deneyimi</title>
    <style>
        /* Genel Tasarım */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f3f3; margin: 0; padding: 0; }
        
        /* Amazon Tarzı Navbar */
        .navbar { background-color: #131921; color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; color: #febd69; cursor: pointer; text-decoration: none; }
        .search-container { flex-grow: 1; margin: 0 30px; display: flex; }
        .search-input { width: 100%; padding: 10px; border-radius: 4px 0 0 4px; border: none; outline: none; }
        .search-btn { background: #febd69; border: none; padding: 10px 20px; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }
        .nav-tools { display: flex; gap: 25px; align-items: center; }
        .cart-icon { cursor: pointer; position: relative; font-size: 22px; }
        .cart-count { background: #f08804; color: black; border-radius: 50%; padding: 2px 7px; font-size: 12px; font-weight: bold; position: absolute; top: -10px; right: -10px; }

        /* Yönetici Şeridi (Teknik Gösterim İçin) */
        .admin-bar { background: #fff; padding: 12px 5%; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .admin-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .admin-btn:hover { background: #219150; }

        /* Ürün Vitrini */
        .main-content { padding: 30px 5%; }
        .section-title { border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 30px; color: #333; font-size: 22px; }
        #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        /* Ürün Kartı Modeli */
        .product-card { background: white; border: 1px solid #eee; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .image-box { position: relative; height: 220px; background: #f9f9f9; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .img-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 3px 10px; border-radius: 15px; font-size: 11px; }
        
        .product-info { padding: 15px; flex-grow: 1; text-align: left; }
        .product-name { font-size: 18px; margin: 0 0 10px 0; color: #111; font-weight: 600; }
        .product-price { font-size: 24px; color: #B12704; font-weight: bold; margin: 5px 0; }
        .stock-info { font-size: 13px; font-weight: bold; margin-bottom: 15px; }

        /* Butonlar */
        .btn-group { padding: 10px 15px 20px; display: flex; flex-direction: column; gap: 8px; }
        .buy-btn { background: #ffd814; border: 1px solid #fcd200; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .buy-btn:hover { background: #f7ca00; }
        .delete-btn { background: #fff1f1; color: #c0392b; border: 1px solid #ffcccc; padding: 7px; border-radius: 5px; font-size: 11px; cursor: pointer; text-align: center; }

        /* Teknik Gereksinim Paneli (Video İçin Alt Köşede Şık Durur) */
        .tech-panel { position: fixed; bottom: 20px; right: 20px; background: #fff; border: 1px solid #febd69; padding: 15px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 12px; z-index: 2000; }
        .tech-panel h4 { margin: 0 0 10px 0; color: #232f3e; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .status-ok { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">ShopIn</a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Ürün veya kategori ara...">
            <button class="search-btn">ARA</button>
        </div>
        <div class="nav-tools">
            <div style="font-size: 13px; text-align: right; line-height: 1.4;">
                <span style="color: #ccc;">Hoş Geldiniz,</span><br>
                <b style="cursor:pointer;" onclick="alert('Sipariş geçmişiniz yükleniyor (GET /orders)')">Hesabım & Siparişler</b>
            </div>
            <div class="cart-icon" onclick="alert('Sepet detayları (POST /cart)')">
                🛒 <span id="cart-count" class="cart-count">0</span>
            </div>
        </div>
    </nav>

    <div class="admin-bar">
        <div style="font-size: 13px; color: #555;">Sistem Durumu: <b style="color:#27ae60;">Yönetici Paneli Erişimi Aktif</b></div>
        <button class="admin-btn" onclick="alert('Yeni ürün ekleme formu (POST /products)')">+ Yeni Ürün Ekle</button>
    </div>

    <div class="main-content">
        <h2 class="section-title">Canlı Ürün Kataloğu</h2>
        
        <div id="product-grid">
            <p style="grid-column: 1 / -1; text-align: center; color: #888; padding: 50px;">
                Sunucuya bağlanılıyor (GET /products)...
            </p>
        </div>
    </div>

    <div class="tech-panel">
        <h4>Teknik Durum (ShopIn API)</h4>
        <div><span class="status-ok">✅</span> RE-01: Stok Yönetimi</div>
        <div><span class="status-ok">✅</span> RE-03: MongoDB Atlas Cloud</div>
        <div><span class="status-ok">✅</span> RE-04: Vercel Cloud Deployment</div>
        <div><span class="status-ok">✅</span> API: RESTful Endpoints Active</div>
    </div>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ShopIn | Premium E-Ticaret</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fafafa; margin: 0; text-align: center; color: #111; }
        .screen { display: none; padding: 50px 20px; }
        .active-screen { display: block; }
        
        /* 💎 Premium Buton Tasarımı */
        .btn { padding: 10px 20px; margin: 10px; cursor: pointer; border: 2px solid #000; border-radius: 4px; background: #000; color: #fff; font-size: 15px; font-weight: 600; transition: all 0.3s ease; }
        .btn:hover { background: #fff; color: #000; }
        
        /* İkincil Butonlar (Geri dön, sil vb. için) */
        .btn-outline { background: #fff; color: #000; }
        .btn-outline:hover { background: #000; color: #fff; }

        input, select { padding: 10px; margin: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #000; }
        
        /* 💎 Premium Navbar ve Logo */
        .navbar { background: #fff; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
        .logo span { background: #000; color: #fff; padding: 2px 8px; border-radius: 4px; margin-left: 2px; }
        
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-right button, .nav-right select, .nav-right input { margin: 0; }
        
        /* 💎 Premium Ürün Kartları */
        .product-card { background:#fff; padding:20px; border-radius:8px; width:220px; border: 1px solid #eee; text-align:center; transition: transform 0.3s, box-shadow 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .product-img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; cursor: pointer; background: #fff; }
        
        .cart-item { display:flex; justify-content:space-between; align-items:center; background:#fff; padding:15px; margin-bottom:10px; border-radius:8px; border: 1px solid #eee; }
        .cart-item-img { width: 60px; height: 60px; object-fit: contain; border-radius: 5px; margin-right: 15px; background: #fff; }
    </style>
</head>
<body>

    <div id="screen-role" class="screen active-screen">
        <div style="margin-bottom: 30px;" class="logo">SHOP<span>IN</span></div>
        <p style="color: #666; margin-bottom: 20px;">Lütfen giriş türünüzü seçin</p>
        <button class="btn" onclick="showAuth('user')">Kullanıcı Girişi</button>
        <button class="btn btn-outline" onclick="showAuth('admin')">Yönetici Girişi</button>
    </div>

    <div id="screen-auth" class="screen">
        <div style="margin-bottom: 20px;" class="logo">SHOP<span>IN</span></div>
        <h2 id="auth-title" style="font-weight: 600;">Giriş / Kayıt</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı"><br>
        <input type="password" id="password" placeholder="Şifre"><br><br>
        <button class="btn" onclick="login()">Giriş Yap</button>
        <button class="btn btn-outline" onclick="register()">Kayıt Ol</button><br><br>
        <button class="btn btn-outline" style="border: none; text-decoration: underline;" onclick="showScreen('screen-role')">Geri Dön</button>
    </div>

    <div id="screen-store" class="screen" style="padding: 0;">
        <div class="navbar">
            <div class="logo">SHOP<span>IN</span></div>
            <div class="nav-right">
                <input type="text" id="searchInput" placeholder="Ürün Ara..." onkeyup="filterProducts()">
                <select id="categoryFilter" class="btn btn-outline" onchange="filterProducts()">
                    <option value="all">Tüm Kategoriler</option>
                    <option value="Elektronik">Elektronik</option>
                    <option value="Giyim">Giyim</option>
                    <option value="Kitap">Kitap</option>
                    <option value="Ev Aletleri">Ev Aletleri</option>
                </select>
                <button id="cart-btn" class="btn" onclick="showCart()">🛒 Sepet (0)</button>
                <button class="btn btn-outline" onclick="showAccountScreen()">👤 Hesabım</button>
            </div>
        </div>
        <br>
        <div id="products-grid" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; max-width: 1200px; margin: auto;"></div>
    </div>

    <div id="screen-product-detail" class="screen">
        <div class="navbar">
            <div class="logo">SHOP<span>IN</span></div>
            <button class="btn btn-outline" onclick="showScreen('screen-store')">Mağazaya Dön</button>
        </div>
        <br>
        <div id="product-detail-content" style="max-width: 500px; margin: auto; background: #fff; padding: 40px; border-radius: 8px; border: 1px solid #eee; text-align: left;"></div>
    </div>

    <div id="screen-cart" class="screen">
        <div class="navbar">
            <div class="logo">SHOP<span>IN</span></div>
            <button class="btn btn-outline" onclick="showScreen('screen-store')">Alışverişe Devam Et</button>
        </div>
        <br>
        <h2 style="font-weight: 600;">Sepetim</h2>
        <div id="cart-items" style="max-width: 600px; margin: auto; text-align: left;"></div>
        <h2 id="cart-total" style="text-align: center; margin-top: 20px; font-weight: 800;">Toplam: 0 TL</h2>
        <button class="btn" style="width: 250px; font-size: 18px; padding: 15px;" onclick="checkout()">Siparişi Onayla</button>
    </div>

    <div id="screen-account" class="screen">
        <div class="navbar">
            <div class="logo">SHOP<span>IN</span></div>
            <div>
                <button class="btn btn-outline" onclick="showScreen('screen-store')">Alışverişe Dön</button>
                <button class="btn" onclick="logout()">Çıkış Yap</button>
            </div>
        </div>
        <br>
        <div style="max-width: 600px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #eee;">
            <h2 id="account-title" style="margin-top:0; border-bottom: 1px solid #eee; padding-bottom: 15px;">Hesap Detayları</h2>
            <h3 style="text-align: left; margin-top: 25px;">📦 Geçmiş Siparişlerim</h3>
            <div id="order-history-list" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
